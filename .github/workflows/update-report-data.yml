name: Update report data (CrUX + PSI)

on:
  schedule:
    - cron: "0 6 15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install google-auth
      - name: Refresh data.json from Google APIs
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_data.py
      - name: Commit & push if changed
        run: |
          git config user.name  "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "No changes — data already current."
          else
            git add data.json
            git commit -m "chore: monthly data refresh (CrUX + PSI) [skip ci]"
            # This job's checkout is a snapshot from when it started. If anyone
            # (or any other run) pushes to main in the meantime — e.g. a manual
            # edit via the GitHub web editor, which is exactly what rejected
            # this push on Aug 9 2026 — origin/main has moved on, and a plain
            # `git push` gets rejected as non-fast-forward. Our commit only
            # ever touches data.json, so rebasing onto the current tip right
            # before pushing is safe and clears that race without needing a
            # human to manually re-run the job.
            git fetch origin main
            git rebase origin/main
            git push
          fi
