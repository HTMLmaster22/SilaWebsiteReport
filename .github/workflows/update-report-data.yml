name: Update report data (CrUX + PSI)

on:
  schedule:
    - cron: "0 6 15 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose homepage as seen from this runner
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python scripts/diag_desktop.py
