name: PSI diagnostics (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which scripts block the homepage
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python scripts/psi_diagnose.py
